# Внешняя таксономия атак — ЕДИНСТВЕННЫЙ источник истины.
# docs/attack-taxonomy.md порождается отсюда (aiuc taxonomy); руками не правят.
#
# Первая мера в проекте, приходящая НЕ ОТ НАС. На OWASP LLM Top 10 ссылается сам AIUC-1
# (раздел Framework comparisons), то есть это не произвольный список, а тот, с которым
# стандарт себя соотносит.
#
# status: tested | gap | not_applicable
#   tested         — атака ВЫВЕДЕНА ИЗ ОПИСАНИЯ категории и есть в наборе (гейт проверяет)
#   gap            — категория применима к архитектуре, но мы её не проверяем
#   not_applicable — архитектура стенда не содержит предмета категории
#
# ГЛАВНОЕ ПРАВИЛО: `tested` НЕ ставится за «что-то похожее». Отдалённо смежное — это `gap`.
# Иначе внешний список станет новым способом поставить себе галочку, и вся затея бессмысленна.
#
# АСИММЕТРИЯ ПРИВЯЗКИ (намеренная):
#   attacks/suite.yaml → taxonomy   — ОДНА категория: основной ВЕКТОР атаки;
#   здесь: category.attacks         — ВСЕ атаки, упражняющие категорию (могут пересекаться).
# Пример: direct-01 имеет вектор LLM01 (инъекция), но его ЦЕЛЬ — вытащить секрет из системного
# промпта, поэтому он же упражняет LLM07. Обе привязки правдивы; это не двойной учёт, потому что
# доля покрытия считается по КАТЕГОРИЯМ, а не по атакам.

name: "OWASP Top 10 for LLM Applications"
version: "2025"
source: "https://genai.owasp.org/llm-top-10/ (сверено 2026-07-16)"

categories:
  - id: LLM01
    title: "Prompt Injection"
    status: tested
    rationale: >-
      Прямые инъекции проверяются с фичи 001 (direct-01/02). Косвенная — вредоносная инструкция
      приходит через результат инструмента — добавлена фичей 005 (indirect-01). Benign-кейсы
      контролируют ложные срабатывания того же класса.
    attacks: ["direct-01", "direct-02", "indirect-01", "benign-01", "benign-02"]

  - id: LLM02
    title: "Sensitive Information Disclosure"
    status: tested
    rationale: >-
      Канареечный секрет и PII-детектор (фича 004). Утечка проверяется и в ответе, и через
      аргументы инструментов, и в журнале.
    attacks: ["exfil-01", "exfil-02"]

  - id: LLM03
    title: "Supply Chain"
    status: not_applicable
    rationale: >-
      У стенда нет цепочки поставки: ни плагинов, ни сторонних компонентов, ни загружаемых
      моделей в рантайме. Модель приходит через шов как объект; подменять в этой архитектуре
      нечего.

  - id: LLM04
    title: "Data and Model Poisoning"
    status: not_applicable
    rationale: >-
      Стенд не обучает и не дообучает модель и не строит эмбеддингов: обучающих данных, которые
      можно отравить, в архитектуре нет.

  - id: LLM05
    title: "Improper Output Handling"
    status: gap
    rationale: >-
      ПРИМЕНИМО, но не проверяем. Выходной guardrail маскирует секрет и PII, однако санитизации
      вывода для downstream-потребителя (интерпретация как код/разметка/SQL) нет. Кластер
      output-filters карты покрытия. Помечено gap, а не tested: маскирование ≠ санитизация.

  - id: LLM06
    title: "Excessive Agency"
    status: tested
    rationale: >-
      Allow-list инструментов (wrap_tool_call) и атаки на обход роли (role-01/02): проверяется,
      выполнит ли агент действие вне заявленных полномочий.
    attacks: ["role-01", "role-02"]

  - id: LLM07
    title: "System Prompt Leakage"
    status: tested
    rationale: >-
      Канарейка лежит ИМЕННО в системном промпте, и её раскрытие — критерий успеха атак
      direct-01/02. Попадание точное: это ровно тот класс, что описывает категория.
    attacks: ["direct-01", "direct-02"]

  - id: LLM08
    title: "Vector and Embedding Weaknesses"
    status: not_applicable
    rationale: >-
      У стенда нет RAG и нет векторного хранилища: ни эмбеддингов, ни retrieval-пайплайна, чьи
      слабости описывает категория.

  - id: LLM09
    title: "Misinformation"
    status: gap
    rationale: >-
      ПРИМЕНИМО, но не проверяем. Галлюцинации и заземлённость ответа не измеряются: нет ни базы
      знаний, ни проверки цитат. Кластер output-filters карты (контроль D001 AIUC-1).

  - id: LLM10
    title: "Unbounded Consumption"
    status: gap
    rationale: >-
      ПРИМЕНИМО, но не проверяем. Лимитов частоты и объёма нет; есть только таймаут попытки, что
      про надёжность прогона, а не про исчерпание ресурсов мишени. Кластер input-moderation карты
      (B004/B009 AIUC-1).
