# Машиночитаемый каталог покрытия AIUC-1 — ЕДИНСТВЕННЫЙ источник истины карты.
# docs/aiuc1-coverage.md порождается из этого файла (aiuc coverage); руками карту не правят.
#
# Источник: https://www.aiuc-1.com/evidence (снимок 2026-07-15).
# Стандарт нумерует 53 контроля; E007 и E014 — Retired → 51 активный.
# status: covered | technical_achievable | doc_only | retired
# nature: technical | organizational | mixed  (partial присутствует ⇔ mixed)
# covered ⇒ binding.scorecard_control ссылается на реальный контроль scorecard/controls.py.
#
# ВАЖНО про id кластеров бэклога: они НЕ кодируют номер будущей фичи (было `003-detectors`).
# Порядок реализации меняется — например, фича 003 ушла на починку честности метрик, а не на
# детекторы. За порядок отвечает поле `priority`, за смысл — слаг. Не возвращать номера в id.

version: "1.0.0"
source: "https://www.aiuc-1.com/evidence (снимок 2026-07-15); 53 контроля, E007/E014 retired"

controls:
  # ---------- A. Data & Privacy (8) ----------
  - id: A001
    pillar: data_privacy
    title: "Establish input data policy"
    nature: organizational
    status: doc_only
    binding: { kind: artifact, artifact_type: policy }
    rationale: "политика использования/retention входных данных — документ, не код"
    backlog_item: "governance"

  - id: A002
    pillar: data_privacy
    title: "Establish output data policy"
    nature: organizational
    status: doc_only
    binding: { kind: artifact, artifact_type: policy }
    rationale: "владение выводом, opt-in/opt-out — политика"
    backlog_item: "governance"

  - id: A003
    pillar: data_privacy
    title: "Limit AI agent data access"
    nature: technical
    status: technical_achievable
    binding: { kind: guardrail_rule, stand_mechanism: "scoping доступа/идентичность агента в tool-policy" }
    rationale: "механизма ограничения доступа по роли ещё нет; достижимо как политика инструментов"
    backlog_item: "tool-policy"

  - id: A004
    pillar: data_privacy
    title: "Protect IP & trade secrets"
    nature: mixed
    status: doc_only
    binding: { kind: artifact, artifact_type: policy }
    rationale: "часть — фильтр IP (техническая), часть — гайдлайны пользователю (документ)"
    partial:
      technical: "детект проприетарных паттернов в выводе"
      documentable: "пользовательские гайдлайны по конфиденциальной информации"
    backlog_item: "governance"

  - id: A005
    pillar: data_privacy
    title: "Prevent cross-customer data exposure"
    nature: technical
    status: covered
    binding:
      kind: scorecard_control
      scorecard_control: PRIV-03
      stand_mechanism: "новая песочница на каждую попытку + предикат изоляции над trace"
    rationale: >-
      СУЖЕНИЕ: стандарт требует изоляции между КЛИЕНТАМИ; учебный стенд однопользовательский,
      поэтому покрыта изоляция между ПОПЫТКАМИ (PRIV-03). Мультиарендность вне области.

  - id: A006
    pillar: data_privacy
    title: "Prevent PII leakage"
    nature: technical
    status: covered
    binding:
      kind: scorecard_control
      scorecard_control: PRIV-04
      stand_mechanism: "PII-детектор (aiuc_mini/pii.py) в ответе агента и при записи trace"
    rationale: >-
      ГРАНИЦА: ловятся каноничные формы (email, карта, телефон). Не покрыты имена, адреса,
      нестандартные записи и кодирование — см. specs/004-detectors/contracts/detectors.md.

  - id: A007
    pillar: data_privacy
    title: "Prevent IP violations"
    nature: mixed
    status: doc_only
    binding: { kind: artifact, artifact_type: policy }
    rationale: "защита провайдера (контракт) + фильтр контента (техническая часть)"
    partial:
      technical: "фильтр копирайта/торговых марок в выводе"
      documentable: "контракты провайдера, indemnification"
    backlog_item: "governance"

  - id: A008
    pillar: data_privacy
    title: "Prevent leakage of credentials and secrets"
    nature: technical
    status: covered
    binding:
      kind: scorecard_control
      scorecard_control: PRIV-02
      stand_mechanism: "детект секрета (канарейки) в выводе/аргументах + маскирование в trace"
    rationale: "детект и редакция секрета реализованы; общий secrets-store вне области — сужение честно отражено"

