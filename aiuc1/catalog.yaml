backlog:
  - id: "detectors"
    title: "Детекторы PII/секретов и изоляция данных"
    nature: technical
    priority: 1
    rationale: "прямое продолжение Data & Privacy; новые guardrail-детекторы + предикаты — максимальная отдача первым шагом"

  - id: "input-moderation"
    title: "Модерация входа и anomaly-детект"
    nature: technical
    priority: 2
    rationale: "расширяет входной guardrail: детект adversarial-входа, rate-limit, фильтрация"

  - id: "tool-policy"
    title: "Политика tool-call и human-approval (HITL)"
    nature: technical
    priority: 3
    rationale: "scoping доступа и валидация tool-call через LangChain HITL middleware"

  - id: "output-filters"
    title: "Фильтры вывода и надёжность"
    nature: technical
    priority: 4
    rationale: "фильтры вредного/out-of-scope вывода, лимиты объёма, groundedness"

  - id: "governance"
    title: "Governance-артефакты (политики, планы, runbook'и)"
    nature: organizational
    priority: 5
    rationale: "весь организационный пласт Accountability и политики — документация, не прогон"

  - id: "attestation"
